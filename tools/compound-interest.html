<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Compound Interest Calculator | 28Tools</title>
  <meta name="description" content="Calculate compound interest for any principal, rate, and time period. Choose daily, monthly, quarterly, half-yearly, or annual compounding."/>
  <meta name="robots" content="index,follow"/><link rel="canonical" href="https://28tools.io/tools/compound-interest.html"/>
  <meta name="theme-color" content="#0a0d14"/>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%236366f1'/><text x='32' y='44' font-family='sans-serif' font-weight='900' font-size='34' fill='%23fff' text-anchor='middle' letter-spacing='-1.5'>28</text></svg>"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body class="tool-page">
<header role="banner"><nav class="nav"><div class="container nav__inner">
  <a href="../index.html" class="nav__logo"><div class="nav__logo-icon" aria-hidden="true">28</div>28Tools</a>
  <div class="nav__actions" style="margin-left:auto"><a href="../index.html" class="btn btn-ghost btn-sm">← All Tools</a></div>
</div></nav></header>

<main class="tool-page__body">
  <section class="tool-hero"><div class="container">
    <nav class="tool-hero__breadcrumb"><a href="../index.html">Home</a><span>›</span><span>Compound Interest</span></nav>
    <div class="tool-hero__header">
      <div class="tool-hero__icon icon-calc">💹</div>
      <div class="tool-hero__info">
        <h1 class="tool-hero__title">Compound Interest Calculator</h1>
        <p class="tool-hero__desc">Compute compound interest with flexible compounding frequencies — daily, monthly, quarterly, half-yearly or annual.</p>
        <div class="tool-hero__meta"><span class="tool-card__cat-indicator badge-calc">Finance</span><span class="tool-card__privacy">🔒 Private</span></div>
      </div>
    </div>
  </div></section>

  <section class="tool-workspace"><div class="container">
    <div class="tool-card-panel" style="max-width:640px">
      <form id="ci-form" novalidate>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="ci-principal">Principal Amount (₹)</label>
            <input id="ci-principal" class="form-input" type="number" min="1" placeholder="e.g. 100000" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="ci-rate">Annual Rate (%)</label>
            <input id="ci-rate" class="form-input" type="number" min="0.01" max="100" step="0.01" placeholder="e.g. 8" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="ci-time">Time Period (Years)</label>
            <input id="ci-time" class="form-input" type="number" min="0.1" max="100" step="0.5" placeholder="e.g. 5" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="ci-freq">Compounding</label>
            <select id="ci-freq" class="form-select">
              <option value="365">Daily</option>
              <option value="12">Monthly</option>
              <option value="4">Quarterly</option>
              <option value="2">Half-Yearly</option>
              <option value="1" selected>Annually</option>
            </select>
          </div>
        </div>
        <div class="flex gap-md mt-lg">
          <button type="submit" class="btn btn-primary btn-lg" style="flex:1">Calculate</button>
          <button type="button" class="btn btn-secondary" id="ci-reset">Reset</button>
        </div>
      </form>

      <div id="ci-result" class="hidden mt-lg">
        <div class="result-grid">
          <div class="result-card success"><div class="result-value" id="ci-total"></div><div class="result-label">Total Amount</div></div>
          <div class="result-card"><div class="result-value" id="ci-interest"></div><div class="result-label">Interest Earned</div></div>
          <div class="result-card"><div class="result-value" id="ci-simple"></div><div class="result-label">Simple Interest (comp.)</div></div>
        </div>
        <div class="alert alert-info mt-md" id="ci-formula-box"></div>
        <button class="btn btn-ghost btn-sm mt-md copy-btn" onclick="copyCI(this)">📋 Copy</button>
      </div>
    </div>
  </div></section>
</main>
<footer class="footer"><div class="container"><div class="footer__bottom"><p class="footer__copy">© 2024 28Tools · <a href="../index.html" style="color:var(--accent)">All Tools</a></p></div></div></footer>
<script src="../js/main.js"></script>
<script>
(function(){
  document.getElementById('ci-form').addEventListener('submit',e=>{
    e.preventDefault();
    const P=validNum(document.getElementById('ci-principal').value,1);
    const r=validNum(document.getElementById('ci-rate').value,0.01,100);
    const t=validNum(document.getElementById('ci-time').value,0.1,100);
    const n=parseInt(document.getElementById('ci-freq').value);
    if(!P||!r||!t) return;
    const total=P*Math.pow(1+r/100/n,n*t);
    const interest=total-P;
    const si=P*r*t/100;
    document.getElementById('ci-total').textContent=fmtINR(total);
    document.getElementById('ci-interest').textContent=fmtINR(interest);
    document.getElementById('ci-simple').textContent=fmtINR(si);
    const freqLabel={365:'Daily',12:'Monthly',4:'Quarterly',2:'Half-yearly',1:'Annual'}[n];
    document.getElementById('ci-formula-box').textContent=`Formula: A = ${fmtINR(P)} × (1 + ${r}%/${n})^(${n}×${t}) | Compounding: ${freqLabel}`;
    document.getElementById('ci-result').classList.remove('hidden');
  });
  document.getElementById('ci-reset').addEventListener('click',()=>{ document.getElementById('ci-form').reset(); document.getElementById('ci-result').classList.add('hidden'); });
  window.copyCI=btn=>copyText(`Principal: ${document.getElementById('ci-total').textContent}\nInterest: ${document.getElementById('ci-interest').textContent}`,btn);
})();
</script>
</body>
</html>
